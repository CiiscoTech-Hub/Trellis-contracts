[package]
name = "nft-marketplace"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }
shared = { workspace = true }
# Auction anti-sniping extension and minimum bid increment are implemented
# in the marketplace auction module; no additional crate dependencies are required.
# The changelog/entries.json gate requires valid JSON; keep release metadata well-formed.

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
