name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Weekly re-scan so advisories published after merge still surface.
  schedule:
    - cron: "0 6 * * 1"
  # Allows manually triggering the weekly-scheduled jobs (e.g. fuzz-cross-contract).
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build all contracts
        run: cargo build --release

  wasm-size-budget:
    name: WASM Size Budget Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install soroban CLI
        run: cargo install soroban-cli

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build and measure WASM sizes
        run: |
          mkdir -p wasm-sizes
          contracts=(
            "access-control"
            "aid-contract"
            "governance-contract"
            "nft-marketplace"
            "oracle-contract"
            "payments-contract"
            "rebalancer-contract"
            "referral-contract"
            "registry-contract"
            "treasury-contract"
          )

          for contract in "${contracts[@]}"; do
            if [ -d "contracts/$contract" ]; then
              cd "contracts/$contract"
              soroban contract build --release 2>/dev/null || cargo build --release --target wasm32-unknown-unknown
              cd ../..
              wasm_file=$(find target/wasm32-unknown-unknown/release -name "${contract}.wasm" 2>/dev/null | head -1)
              if [ -z "$wasm_file" ]; then
                wasm_file=$(find target/wasm32-unknown-unknown/release -name "*.wasm" | grep -i "$contract" | head -1)
              fi
              if [ -n "$wasm_file" ]; then
                size=$(stat -f%z "$wasm_file" 2>/dev/null || stat -c%s "$wasm_file")
                echo "$contract: $size bytes" >> wasm-sizes/sizes.txt
              fi
            fi
          done
          cat wasm-sizes/sizes.txt

      - name: Check against budgets
        run: |
          # Define per-contract budgets (in bytes)
          declare -A budgets=(
            ["access-control"]=256000
            ["aid-contract"]=512000
            ["governance-contract"]=512000
            ["nft-marketplace"]=600000
            ["oracle-contract"]=400000
            ["payments-contract"]=512000
            ["rebalancer-contract"]=512000
            ["referral-contract"]=512000
            ["registry-contract"]=512000
            ["treasury-contract"]=512000
          )

          failed=0
          while IFS=': ' read -r contract size; do
            contract_name=$(echo "$contract" | xargs)
            size=$(echo "$size" | sed 's/[^0-9]//g')
            budget=${budgets[$contract_name]:-512000}
            
            if [ "$size" -gt "$budget" ]; then
              echo "❌ $contract_name: $size bytes exceeds budget of $budget bytes"
              failed=1
            else
              echo "✓ $contract_name: $size bytes (budget: $budget bytes)"
            fi
          done < wasm-sizes/sizes.txt

          exit $failed

      - name: Comment PR with size report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '## WASM Size Report\n\n';

            try {
              const sizes = fs.readFileSync('wasm-sizes/sizes.txt', 'utf8');
              report += '```\n' + sizes + '\n```\n';
            } catch (e) {
              report += 'Could not read size report\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            })

  # Machine-readable changelog validation (Issue #126). No Rust involved —
  # runs on the runner's preinstalled Node, matching this repo's other
  # dependency-free Node scripts (verify-deployment.cjs, push-issues.js).
  changelog:
    name: Changelog schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate changelog/entries.json against changelog/schema.json
        run: node scripts/validate-changelog.cjs

  # Release readiness gate verification (Issue #253).
  # Blocks CI when migrations, security checks, smoke tests, or rollback rehearsals fail.
  release-readiness-gate:
    name: Release readiness gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release readiness gate
        run: node scripts/release-readiness-gate.cjs --check-all

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --workspace

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Code coverage: cargo llvm-cov (better no_std support for Soroban than tarpaulin).
  # Reports JSON coverage metrics for all workspace crates.
  # Fails CI if coverage drops below agreed floor.
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test
    env:
      COVERAGE_FLOOR: 70
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run coverage
        run: cargo llvm-cov --all-crates --output-format json --output json-coverage.json

      - name: Check coverage floor
        run: |
          COVERAGE=$(jq '.coverage[0].percent_covered' json-coverage.json)
          FLOOR=${{ env.COVERAGE_FLOOR }}
          echo "Coverage: ${COVERAGE}% | Floor: ${FLOOR}%"
          if (( $(echo "$COVERAGE >= $FLOOR" | bc -l) )); then
            echo "✓ Coverage meets floor"
            exit 0
          else
            echo "✗ Coverage below floor (need to add tests)"
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: json-coverage.json
          if-no-files-found: ignore

  # Cross-contract state fuzzing (Issue #191): stateful proptest harness that
  # drives randomized sequences across the real aid/treasury/referral
  # contracts and checks global token-conservation and referral commission
  # invariants. Runs 1,000+ operations per invocation, so it's kept off the
  # push/PR critical path and scheduled weekly (with manual dispatch).
  fuzz-cross-contract:
    name: Cross-Contract State Fuzzing
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run cross-contract fuzzing harness
        run: |
          cargo test -p testing cross_contract_fuzz:: -- --nocapture

  # Security audit: cargo audit + clippy security preset (see security/README.md).
  # BLOCKING: any high-severity finding (every RustSec vulnerability, panic-family
  # lints) without a valid entry in security/audit-allowlist.toml fails the job.
  # Unmaintained/yanked-crate warnings and medium lints are reported, not gated.
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run security audit
        run: ./scripts/security/run-audit.sh --skip-wasm --allowlist security/audit-allowlist.toml --report security-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: security-report.md
          if-no-files-found: ignore

  # Soroban CPU-instruction / memory-byte footprint profiling (Issue #192).
  # Measures env.budget() cost for the hottest entry point in each of
  # aid-contract, treasury-contract, referral-contract, and
  # rebalancer-contract (see contracts/*/src/profile_budget.rs) and compares
  # it against the checked-in baseline in testing/budget-baseline.json.
  # Fails when a call regresses by more than BUDGET_REGRESSION_THRESHOLD_PERCENT
  # (default 10%, tunable via the repository variable of the same name without
  # editing this workflow). See docs/OBSERVABILITY.md, "Automated Budget
  # Profiling", for how to update the baseline.
  profile-budget:
    name: Budget Profile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BUDGET_REGRESSION_THRESHOLD_PERCENT: ${{ vars.BUDGET_REGRESSION_THRESHOLD_PERCENT || '10' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Profile budget and compare against baseline
        run: ./scripts/profile-budget.sh --threshold "$BUDGET_REGRESSION_THRESHOLD_PERCENT"
